services:
  mediamtx:
    image: bluenviron/mediamtx:1.17.1
    restart: unless-stopped
    volumes:
      - ../streaming/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${MEDIA_RTSP_PORT:-8554}:8554"
    command: ["/mediamtx.yml"]

  video-loop-publisher:
    image: jrottenberg/ffmpeg:7.1-ubuntu2404
    restart: unless-stopped
    entrypoint: ["bash", "/scripts/publish-loop.sh"]
    depends_on:
      mediamtx:
        condition: service_started
    environment:
      VIDEO_DIR: /videos
      RTSP_OUTPUT_URL: rtsp://mediamtx:8554/${MEDIA_STREAM_PATH:-cow-monitor/demo}
      VIDEO_GLOB: ${VIDEO_GLOB:-*.mp4}
    volumes:
      - ../../../all_datasets/videos:/videos:ro
      - ../streaming/publish-loop.sh:/scripts/publish-loop.sh:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cow_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-cow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cow} -d ${POSTGRES_DB:-cow_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  inference-service:
    build:
      context: ../../..
      dockerfile: code/inference-service/Dockerfile
      args:
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${INFERENCE_SERVICE_NAME:-cow-monitor-inference}
      APP_VERSION: "0.1.0"
      API_PREFIX: /api/v1/inference
      PIPELINE_MODE: real
      WORKSPACE_ROOT: /workspace
      YOLO_MODEL_PATH: /workspace/runs/detect/cow_120_on_basecommon/weights/best.pt
      KNN_MODEL_PATH: /workspace/code/knn/knn_behavior_model.npz
    volumes:
      - ../../../:/workspace:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]

  api:
    build:
      context: ../../..
      dockerfile: code/api/Dockerfile
      args:
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-牧巡智控平台 API}
      APP_VERSION: "0.1.0"
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cow}:${POSTGRES_PASSWORD:-cow}@postgres:5432/${POSTGRES_DB:-cow_monitor}
      REDIS_URL: redis://redis:6379/0
      INFERENCE_SERVICE_URL: http://inference-service:8001
      MEDIA_STREAM_INTERNAL_HOST: ${MEDIA_STREAM_INTERNAL_HOST:-mediamtx}
      CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      JWT_SECRET_KEY: ${API_JWT_SECRET_KEY:-stage2-dev-secret-key-with-32-bytes}
      JWT_ALGORITHM: ${API_JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${API_JWT_EXPIRE_MINUTES:-480}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      inference-service:
        condition: service_started
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    build:
      context: ../../..
      dockerfile: code/web/Dockerfile.prod
      args:
        APK_MIRROR_HOST: ${APK_MIRROR_HOST:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
      mediamtx:
        condition: service_started

volumes:
  postgres_data:
